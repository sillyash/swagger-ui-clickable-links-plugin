repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
    - id: check-yaml
    - id: end-of-file-fixer
    - id: trailing-whitespace
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.9.1
    hooks:
    - id: uv-lock
  - repo: https://github.com/will-rice/prettier-pre-commit
    rev: v1.0.1
    hooks:
    - id: prettier-format
